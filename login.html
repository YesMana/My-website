<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Dilshan Manujaya</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }
        .login-logo {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="glass-card login-card">
        <div class="login-logo">
            <span class="logo-d">d</span><span class="logo-m">m</span>
        </div>
        <h2 style="margin-bottom: 10px;">Admin Login</h2>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">Enter your password to access the dashboard.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required style="text-align: center;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <p id="errorMsg" style="color: var(--accent-red); margin-top: 15px; display: none;">Invalid password!</p>
        <div style="margin-top: 30px;">
            <a href="/" style="font-size: 0.9rem; color: var(--text-secondary);"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Init Particles
        if (window.particlesJS) {
            particlesJS('particles-js', {
                "particles": { "number": { "value": 40 }, "color": { "value": ["#00e5ff"] }, "opacity": { "value": 0.5 }, "size": { "value": 3 }, "line_linked": { "enable": true, "distance": 150, "color": "#00e5ff", "opacity": 0.2 } },
                "interactivity": { "detect_on": "window", "events": { "onhover": { "enable": true, "mode": "repulse" } } }
            });
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = '/admin.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch(err) {
                alert('Network error');
            }
        });
    </script>
</body>
</html>
